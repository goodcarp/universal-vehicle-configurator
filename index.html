<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#f2f0e9" />
    <title>Universal Vehicle Configurator</title>
    <meta
      name="description"
      content="A buyer-side vehicle configurator where a person and an agent share one revisioned state. Nine page-defined WebMCP tools, a sourced incentive engine, and a live 3D showroom."
    />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="/favicon.svg" />

    <!-- Relative URLs resolve against the deployed page for modern crawlers.
         After deploying, set og:url and og:image to absolute URLs so older
         scrapers (Facebook, some chat clients) render the card. -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Universal Vehicle Configurator" />
    <meta property="og:title" content="Universal Vehicle Configurator" />
    <meta
      property="og:description"
      content="One revisioned build, two writers. A person and an agent configure the same vehicle through nine page-defined WebMCP tools, and the person always wins."
    />
    <meta property="og:image" content="/images/showroom-fallback.webp" />
    <meta property="og:image:width" content="1600" />
    <meta property="og:image:height" content="900" />
    <meta
      property="og:image:alt"
      content="A representative compact electric SUV in a studio showroom render."
    />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Universal Vehicle Configurator" />
    <meta
      name="twitter:description"
      content="One revisioned build, two writers. A person and an agent configure the same vehicle through nine page-defined WebMCP tools."
    />
    <meta name="twitter:image" content="/images/showroom-fallback.webp" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
